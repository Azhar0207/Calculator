<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Calculator</title>
</head>
<body>
    <div class="container">
        <input type="text" name="" id="displayBox" readonly>
        <br><br>
       <div id="keys">
        <button oncanplay="appendToDisplay('7')">7</button>
        <button oncanplay="appendToDisplay('8')">8</button>
        <button oncanplay="appendToDisplay('9')">9</button>
        <button oncanplay="appendToDisplay('+')" class="operators">+</button>

        <button oncanplay="appendToDisplay('4')">4</button>
        <button oncanplay="appendToDisplay('5')">5</button>
        <button oncanplay="appendToDisplay('6')">6</button>
        <button oncanplay="appendToDisplay('-')" class="operators">-</button>

        <button oncanplay="appendToDisplay('1')">1</button>
        <button oncanplay="appendToDisplay('2')">2</button>
        <button oncanplay="appendToDisplay('3')">3</button>
        <button oncanplay="appendToDisplay('*')" class="operators">x</button>

        
        <button oncanplay="appendToDisplay('.')">.</button>
        <button oncanplay="appendToDisplay('c')" class="special">C</button>
        <button oncanplay="appendToDisplay('=')" class="special">=</button>
        <button oncanplay="appendToDisplay('/')" class="operators">/</button>
       </div>
    </div>
</body>
</html>
